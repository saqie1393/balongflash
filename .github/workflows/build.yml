name: Build Balong Flash (Windows)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Verify balong_flash.c is C code
        run: |
          # Check agar ghalti se YAML content C file mein to nahi
          if head -5 balong_flash.c | grep -q "name:\|uses:\|jobs:"; then
            echo "ERROR: balong_flash.c mein YAML content hai! Git se restore karein."
            exit 1
          fi
          echo "balong_flash.c looks like valid C code."

      - name: Generate buildno.h
        run: |
          # build file se number utha kar header banayein
          echo "#define BUILDNO $(cat build 2>/dev/null || echo 1)" > winbuild/balong_flash/buildno.h

      - name: Compile Windows Executable (x86_64)
        run: |
          set -e
          
          x86_64-w64-mingw32-gcc \
            -O2 -static -D_WIN32_WINNT=0x0600 -D_WIN32 -D_MSC_VER=1900 \
            -I. -Iwinbuild/balong_flash -Iwinbuild/zlib \
            -w \
            balong_flash.c \
            flasher.c \
            ptable.c \
            util.c \
            signver.c \
            hdlcio_win32.c \
            lzma/Alloc.c \
            lzma/LzmaDec.c \
            winbuild/balong_flash/getopt.c \
            winbuild/zlib/adler32.c \
            winbuild/zlib/crc32.c \
            winbuild/zlib/inffast.c \
            winbuild/zlib/inflate.c \
            winbuild/zlib/inftrees.c \
            winbuild/zlib/trees.c \
            winbuild/zlib/uncompr.c \
            winbuild/zlib/zutil.c \
            -o balong_flash_x64.exe \
            -lsetupapi -lws2_32

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: balong-flash-x64
          path: balong_flash_x64.exe
          if-no-files-found: error

name: Build Balong Flash (Windows)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: x86_64-w64-mingw32-gcc
            out: balong_flash-x64.exe
          - arch: i686
            cc: i686-w64-mingw32-gcc
            out: balong_flash-x86.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Verify required files exist
        run: |
          echo "=== Checking Windows headers ==="
          ls -la winbuild/*.h
          echo "=== Checking zlib sources ==="
          ls -la winbuild/zlib/*.c | head -5

      - name: Build (static, correct includes, with zlib)
        run: |
          set -e
          test -f build || echo "1" > build

          # MinGW ke liye flags. -Iwinbuild aur -Iwinbuild/zlib add kiye gaye hain.
          # Zlib ki saari .c files ko explicitly compile kar rahe hain taake linker ko undefined reference na aaye.
          make CC=${{ matrix.cc }} \
               CFLAGS="-O2 -I. -Iwinbuild -Iwinbuild/zlib -static -D_WIN32_WINNT=0x0600" \
               LDFLAGS="-static" \
               LIBS="winbuild/zlib/*.c -lws2_32" \
               V=1 || {
                 echo "Makefile failed! Attempting manual compilation..."
                 
                 # Agar Makefile fail ho jaye, to manual compile karte hain
                 ${{ matrix.cc }} -O2 -I. -Iwinbuild -Iwinbuild/zlib -static -D_WIN32_WINNT=0x0600 \
                   balong_flash.c hdlcio.c ptable.c flasher.c util.c signver.c \
                   winbuild/getopt.c winbuild/zlib/*.c \
                   -o balong_flash.exe -lws2_32
               }

      - name: Rename output
        run: |
          set -e
          if [ -f balong_flash.exe ]; then
            mv balong_flash.exe ${{ matrix.out }}
          elif [ -f balong_flash ]; then
            mv balong_flash ${{ matrix.out }}
          else
            echo "Build output not found!"
            ls -la
            exit 1
          fi
          file ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balong-flash-${{ matrix.arch }}
          path: ${{ matrix.out }}
          if-no-files-found: error

name: Build Balong Flash (Windows)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: x86_64-w64-mingw32-gcc
            out: balong_flash-x64.exe
          - arch: i686
            cc: i686-w64-mingw32-gcc
            out: balong_flash-x86.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Generate buildno.h
        run: |
          # Visual Studio ke PreBuildEvent ki tarah buildno.h generate kar rahe hain
          echo "#define BUILDNO $(cat build 2>/dev/null || echo 1)" > winbuild/balong_flash/buildno.h

      - name: Compile and Link
        run: |
          set -e
          
          # -Iwinbuild/balong_flash : printf.h, getopt.h, buildno.h ke liye
          # -Iwinbuild/zlib          : zlib.h ke liye
          # -Dprintf=win_printf      : printf.h ke custom function ko handle karne ke liye
          
          ${{ matrix.cc }} \
            -O2 -static -D_WIN32_WINNT=0x0600 -D_WIN32 \
            -I. -Iwinbuild/balong_flash -Iwinbuild/zlib \
            -Dprintf=win_printf \
            balong_flash.c \
            flasher.c \
            ptable.c \
            util.c \
            signver.c \
            hdlcio_win32.c \
            lzma/Alloc.c \
            lzma/LzmaDec.c \
            winbuild/balong_flash/getopt.c \
            winbuild/zlib/adler32.c \
            winbuild/zlib/crc32.c \
            winbuild/zlib/inffast.c \
            winbuild/zlib/inflate.c \
            winbuild/zlib/inftrees.c \
            winbuild/zlib/trees.c \
            winbuild/zlib/uncompr.c \
            winbuild/zlib/zutil.c \
            -o balong_flash.exe \
            -lsetupapi -lws2_32

      - name: Rename output
        run: |
          set -e
          if [ -f balong_flash.exe ]; then
            mv balong_flash.exe ${{ matrix.out }}
          else
            echo "Build output not found!"
            exit 1
          fi
          file ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balong-flash-${{ matrix.arch }}
          path: ${{ matrix.out }}
          if-no-files-found: error

name: Build Balong Flash (Windows)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: x86_64-w64-mingw32-gcc
            out: balong_flash-x64.exe
          - arch: i686
            cc: i686-w64-mingw32-gcc
            out: balong_flash-x86.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Verify source files exist
        run: |
          echo "=== Source files ==="
          ls -la
          echo "=== Header files ==="
          find . -name "*.h" -type f
          echo "=== Includes in balong_flash.c ==="
          grep -E '^\s*#include' balong_flash.c || echo "No includes found"

      - name: Build (static)
        run: |
          set -e
          # Makefile ko force karo ke build dir ban jaye
          test -f build || echo "1" > build

          make CC=${{ matrix.cc }} \
               CFLAGS="-O2 -I. -static -D_WIN32_WINNT=0x0600" \
               LDFLAGS="-static" \
               V=1

      - name: Rename output
        run: |
          set -e
          if [ -f balong_flash.exe ]; then
            mv balong_flash.exe ${{ matrix.out }}
          elif [ -f balong_flash ]; then
            mv balong_flash ${{ matrix.out }}
          else
            echo "Build output not found!"
            ls -la
            exit 1
          fi
          file ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balong-flash-${{ matrix.arch }}
          path: ${{ matrix.out }}
          if-no-files-found: error

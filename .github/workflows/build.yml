name: Build and Release Balong Flash (Windows)

on:
  push:
    branches:
      - master
    tags:
      - 'v*' # Jab aap v1.0 waghera tag lagayenge to release banegi
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: x64
            cc: x86_64-w64-mingw32-gcc
            out: balong_flash-x64.exe
          - arch: x86
            cc: i686-w64-mingw32-gcc
            out: balong_flash-x86.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Generate buildno.h
        run: |
          echo "#define BUILDNO $(cat build 2>/dev/null || echo 1)" > winbuild/balong_flash/buildno.h

      - name: Compile Windows Executable (${{ matrix.arch }})
        run: |
          set -e
          
          ${{ matrix.cc }} \
            -O2 -static -D_WIN32_WINNT=0x0600 -D_WIN32 -D_MSC_VER=1900 \
            -I. -Iwinbuild/balong_flash -Iwinbuild/zlib \
            -w \
            balong_flash.c \
            flasher.c \
            ptable.c \
            util.c \
            signver.c \
            hdlcio_win32.c \
            lzma/Alloc.c \
            lzma/LzmaDec.c \
            winbuild/balong_flash/getopt.c \
            winbuild/zlib/adler32.c \
            winbuild/zlib/crc32.c \
            winbuild/zlib/inffast.c \
            winbuild/zlib/inflate.c \
            winbuild/zlib/inftrees.c \
            winbuild/zlib/trees.c \
            winbuild/zlib/uncompr.c \
            winbuild/zlib/zutil.c \
            -o ${{ matrix.out }} \
            -lsetupapi -lws2_32 -luuid \
            -Wl,--allow-multiple-definition

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: balong-flash-${{ matrix.arch }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Sirf tab chalega jab Tag lagaya jaye
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/balong-flash-x64/balong_flash-x64.exe
            artifacts/balong-flash-x86/balong_flash-x86.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
